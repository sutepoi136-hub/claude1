<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>議事録クエスト</title>
  <meta name="description" content="会議を聞いて議事録を書く、PMO練習ゲーム。仕事編(AXプロジェクト)と魔王軍編の2つの物語。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📝%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho+B1:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="top-in">
      <button type="button" class="brand" data-action="home" aria-label="ホームへ">
        <span class="mark" aria-hidden="true">議</span><b>議事録クエスト</b>
      </button>
      <nav class="top-nav" aria-label="メニュー">
        <div class="me" id="me" aria-label="あなたの成績"></div>
        <button type="button" class="nav-btn" data-action="mute" id="nav-sound"></button>
        <button type="button" class="nav-btn" data-help="howto" id="nav-help"></button>
        <button type="button" class="nav-btn" data-action="settings" id="nav-settings"></button>
      </nav>
    </div>
  </header>

  <main>
    <section id="view-home" class="view" aria-label="ホーム"></section>
    <section id="view-series" class="view" aria-label="シリーズ" hidden></section>
    <section id="view-play" class="view" aria-label="会議" hidden></section>
    <section id="view-result" class="view" aria-label="結果" hidden></section>
  </main>

  <!-- ルール -->
  <dialog id="dlg-help" aria-labelledby="dlg-help-title">
    <form method="dialog" class="dlg-head"><h3 id="dlg-help-title">遊び方とルール</h3><button class="btn ghost icon x" aria-label="閉じる" data-icon="x"></button></form>
    <div class="dlg-body" id="help-body"></div>
  </dialog>

  <!-- 物語(プロローグ・その後) -->
  <dialog id="dlg-story" aria-labelledby="dlg-story-title">
    <form method="dialog" class="dlg-head"><h3 id="dlg-story-title"></h3><button class="btn ghost icon x" aria-label="閉じる" data-icon="x"></button></form>
    <div class="dlg-body" id="story-body"></div>
    <div class="dlg-foot" id="story-foot"></div>
  </dialog>

  <!-- 設定 -->
  <dialog id="dlg-settings" aria-labelledby="dlg-settings-title">
    <form method="dialog" class="dlg-head"><h3 id="dlg-settings-title">設定</h3><button class="btn ghost icon x" aria-label="閉じる" data-icon="x"></button></form>
    <div class="dlg-body" id="settings-body"></div>
  </dialog>

  <!-- はじめに(初回だけ) -->
  <dialog id="dlg-welcome" aria-labelledby="dlg-welcome-title">
    <div class="dlg-head"><span class="mark" aria-hidden="true">議</span><h3 id="dlg-welcome-title">議事録クエストへようこそ</h3></div>
    <div class="dlg-body" id="welcome-body"></div>
    <div class="dlg-foot"><button type="button" class="btn primary lg" id="welcome-start">はじめる</button></div>
  </dialog>

  <!-- テンプレート -->
  <dialog id="dlg-tpl" aria-labelledby="dlg-tpl-title">
    <form method="dialog" class="dlg-head"><h3 id="dlg-tpl-title">議事録テンプレート</h3><button class="btn ghost icon x" aria-label="閉じる" data-icon="x"></button></form>
    <div class="dlg-body dlg-split">
      <div id="tpl-list" class="tpl-list"></div>
      <div>
        <div class="field"><label for="tpl-name">テンプレート名</label><input id="tpl-name" type="text" maxlength="40" placeholder="例: 定例会議用"></div>
        <div class="field"><label for="tpl-body">内容</label><textarea id="tpl-body" rows="11" placeholder="【決定事項】&#10;・"></textarea></div>
        <label class="check"><input type="checkbox" id="tpl-default"> 新しい会議を始めるとき、自動で議事録に入れる</label>
        <p class="hint" id="tpl-note"></p>
        <div class="btns" style="margin-top:14px">
          <button type="button" id="tpl-delete" class="btn sm danger">削除</button>
          <span style="flex:1"></span>
          <button type="button" id="tpl-new" class="btn sm">新規</button>
          <button type="button" id="tpl-save" class="btn sm primary">保存</button>
        </div>
      </div>
    </div>
  </dialog>

  <div id="tip" class="tip" role="tooltip" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="confetti" class="confetti" aria-hidden="true"></div>

  <!-- 採点・ゲームの中核(画面に依存しない。テストでも読み込む) -->
  <script src="js/core/text.js"></script>
  <script src="js/core/parser.js"></script>
  <script src="js/core/scorer.js"></script>
  <script src="js/core/game.js"></script>
  <script src="js/core/store.js"></script>
  <!-- 物語とシナリオ(話を追加したら、ここにも1行足す) -->
  <script src="js/data/registry.js"></script>
  <script src="js/data/work/series.js"></script>
  <script src="js/data/work/ep01.js"></script>
  <script src="js/data/work/ep02.js"></script>
  <script src="js/data/work/ep03.js"></script>
  <script src="js/data/work/ep04.js"></script>
  <script src="js/data/work/ep05.js"></script>
  <script src="js/data/work/ep06.js"></script>
  <script src="js/data/work/ep07.js"></script>
  <script src="js/data/work/ep08.js"></script>
  <script src="js/data/work/ep10.js"></script>
  <script src="js/data/work/ep11.js"></script>
  <script src="js/data/maou/series.js"></script>
  <script src="js/data/maou/ep01.js"></script>
  <script src="js/data/maou/ep02.js"></script>
  <script src="js/data/maou/ep03.js"></script>
  <script src="js/data/maou/ep04.js"></script>
  <script src="js/data/maou/ep05.js"></script>
  <script src="js/data/maou/ep06.js"></script>
  <script src="js/data/maou/ep07.js"></script>
  <script src="js/data/maou/ep11.js"></script>
  <script src="js/data/maou/ep12.js"></script>
  <!-- 画面 -->
  <script src="js/ui/icons.js"></script>
  <script src="js/ui/help.js"></script>
  <script src="js/ui/speech.js"></script>
  <script src="js/ui/audio.js"></script>
  <script src="js/ui/sfx.js"></script>
  <script src="js/ui/bgm.js"></script>
  <script src="js/ui/app.js"></script>
</body>
</html>
